<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0F766E" />
<title>Mobile Parts Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
/* === assets/styles.css === */
/* ============================================================
   Mobile Parts Finder  ·  Design tokens & base
   Palette grounded in the repair-bench world:
   bench ink, signal teal, kapton amber, anti-static neutrals.
   ============================================================ */

:root{
  /* --- ground & surfaces (light) --- */
  --paper:        #F2F5F4;
  --paper-2:      #E8EDEB;
  --surface:      #FFFFFF;
  --surface-2:    #F7FAF9;
  --surface-3:    #EDF2F1;
  --line:         #DDE5E3;
  --line-soft:    #E9EFEE;

  /* --- ink --- */
  --ink:          #0A1512;
  --ink-2:        #47605B;
  /* #7A918C read at only 3.36:1 on white — under the 4.5 small-text floor, and
     it carried every muted label on the site: spec captions, model counts, the
     "launch price" line. #567269 is the nearest tone that clears 4.5 on all
     three surfaces (4.64 worst case) and keeps the same cool-grey character. */
  --ink-3:        #567269;

  /* --- signal teal (primary) --- */
  --teal-900:     #073B36;
  --teal-700:     #0F766E;
  --teal-600:     #12907F;
  --teal-500:     #14B39A;
  --teal-400:     #10D0A8;
  --teal-100:     #D6F5EC;
  --teal-050:     #EBFBF6;

  /* --- kapton amber (accent / premium) --- */
  --amber-700:    #B45309;
  --amber-600:    #E4711C;
  --amber-500:    #FF8A3D;
  --amber-400:    #FFB347;
  --amber-100:    #FFEBD8;
  --amber-050:    #FFF6EC;

  /* --- semantic --- */
  --ok:           #12A67B;
  --ok-bg:        #E4F7F0;
  --warn:         #C2760B;
  --warn-bg:      #FDF2DE;
  --bad:          #DC4B52;
  --bad-bg:       #FDECEC;

  /* --- gradients --- */
  --grad-brand:   linear-gradient(135deg,#0F766E 0%,#12A08C 48%,#10D0A8 100%);
  --grad-amber:   linear-gradient(135deg,#E4711C 0%,#FF8A3D 55%,#FFB347 100%);
  --grad-bench:   linear-gradient(160deg,#08312D 0%,#0B4A43 45%,#0F766E 100%);

  /* --- application header: dark → deep → medium → light → dark sweep,
         with a soft highlight bloom and a vertical depth pass on top.
         Painted identically on the header row and the recent/stats strip
         (sized to their combined height) so they read as one surface. --- */
  --hdr-span: var(--topbar-h);
  --grad-header:
    radial-gradient(1100px 340px at 70% -120px, rgba(26,224,183,.30), transparent 68%),
    linear-gradient(180deg, rgba(255,255,255,.07) 0%, rgba(0,0,0,.20) 100%),
    linear-gradient(100deg,
      #04302B 0%, #073F38 18%, #0B5A51 38%, #12907F 57%, #0A554D 79%, #04302B 100%);
  --hdr-ink:    #FFFFFF;
  --hdr-ink-2:  rgba(255,255,255,.76);
  --hdr-ink-3:  rgba(255,255,255,.58);
  --hdr-fill:   rgba(255,255,255,.13);
  --hdr-fill-2: rgba(255,255,255,.22);
  --hdr-line:   rgba(255,255,255,.18);
  --hdr-accent: #7FEBD3;

  /* light ground product renders sit on, in both themes */
  --pthumb-bg: #FFFFFF;
  --pthumb-line: var(--line);

  /* The category tile's own ground. Pure white, and deliberately the SAME in
     both themes — unlike --pthumb-bg, which cools to a mint in dark. The
     category masters are white-background photographs, so any chip tint shows
     up as a visible rectangle of the asset's white sitting inside a slightly
     grey card, which is what made the tiles look dirty when zoomed. Matching
     the asset exactly is what makes the seam disappear. */
  --ctile-paper: #FFFFFF;

  /* --- brand chip treatments ------------------------------------------------
     Three ways a brand logo is painted, all derived from ONE value: --bmk, the
     brand's own official colour, set per element. Which treatment a brand gets
     is decided in src/data/brand-assets.js, never in a component.

       tint   a pale wash of the brand colour, mark in that colour   (default)
       solid  the brand colour fills the chip, mark reversed to white
       mono   neutral chip, mark in the theme's ink — for identities that are
              black or white and would otherwise vanish in one theme

     Only these tokens change between light and dark, so every treatment is
     defined for both themes by construction and none of them can end up as
     dark-on-dark. Percentages, not colours: the brand hex stays the source. */
  --blogo-bg-mix: 11%;         /* brand colour in the tinted chip */
  --blogo-bg-base: #FFFFFF;
  --blogo-edge: 26%;           /* brand colour in the hairline */
  --blogo-ink-mix: 100%;       /* how much of the brand colour the mark keeps */
  --blogo-ink-base: #FFFFFF;
  --blogo-solid-mix: 100%;     /* brand colour in a solid chip */
  --blogo-solid-base: #FFFFFF;
  --blogo-neutral-bg: #F2F7F5;
  --blogo-neutral-ink: #131F1D;
  --glow-brand:   0 10px 34px -10px rgba(15,118,110,.55);
  --glow-amber:   0 10px 30px -10px rgba(228,113,28,.5);

  /* --- elevation --- */
  --sh-1: 0 1px 2px rgba(10,21,18,.05), 0 2px 8px rgba(10,21,18,.045);
  --sh-2: 0 2px 4px rgba(10,21,18,.05), 0 10px 26px -6px rgba(10,21,18,.12);
  --sh-3: 0 6px 12px rgba(10,21,18,.07), 0 26px 60px -14px rgba(10,21,18,.22);

  /* --- geometry --- */
  --r-xs: 8px; --r-sm: 11px; --r: 15px; --r-lg: 20px; --r-xl: 26px; --r-pill: 999px;

  /* --- type --- */
  --f-display: "Bricolage Grotesque","Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ui:      "Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:    "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  /* --- layout --- */
  --shell: 1320px;
  --pad: 16px;
  --topbar-h: 62px;
  --tabbar-h: 66px;
  --grid-tex: rgba(10,21,18,.045);
}

@media (min-width:768px){ :root{ --pad: 24px; --topbar-h: 70px; } }
@media (min-width:1200px){ :root{ --pad: 32px; } }
/* one compact header row on desktop — no second strip below it */
@media (min-width:1180px){ :root{ --topbar-h: 66px; } }

/* --- dark: system preference (only when no explicit light choice) --- */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#060F0E; --paper-2:#0A1917; --surface:#0E1B19; --surface-2:#122320;
    --surface-3:#172C29; --line:#1E3430; --line-soft:#182A27;
    --ink:#E8F2EF; --ink-2:#9DB5B0; --ink-3:#7C9994;   /* was #6E8A85: 3.95:1 on surface-3 */
    --teal-100:#0C3A36; --teal-050:#0A2B29; --teal-700:#14B39A; --teal-600:#10D0A8;
    --amber-100:#43260F; --amber-050:#2A1A0C; --amber-700:#FFB347; --amber-600:#FF8A3D;
    --ok-bg:#0B3A2F; --warn-bg:#3A2A0C; --bad-bg:#3D1A1C;
    --ok:#3DD6A8; --warn:#F5B851; --bad:#FF7B80;
    --grad-bench: linear-gradient(160deg,#062522 0%,#083C36 45%,#0B5A52 100%);
    --pthumb-bg:#E9F0EE; --pthumb-line:rgba(255,255,255,.14);
    /* brand chips: the wash deepens, the mark lightens, the solids calm down */
    --blogo-bg-mix:24%; --blogo-bg-base:#0B1816; --blogo-edge:42%;
    --blogo-ink-mix:52%; --blogo-ink-base:#FFFFFF;
    --blogo-solid-mix:84%; --blogo-solid-base:#09110F;
    --blogo-neutral-bg:#182A27; --blogo-neutral-ink:#E8F2EF;
    --grad-header:
      radial-gradient(1100px 340px at 70% -120px, rgba(18,196,160,.24), transparent 68%),
      linear-gradient(180deg, rgba(255,255,255,.04) 0%, rgba(0,0,0,.34) 100%),
      linear-gradient(100deg,
        #021D1A 0%, #04302B 18%, #073F38 38%, #0C6558 57%, #063C36 79%, #021D1A 100%);
    --sh-1: 0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
    --sh-2: 0 2px 4px rgba(0,0,0,.4), 0 10px 26px -6px rgba(0,0,0,.55);
    --sh-3: 0 6px 12px rgba(0,0,0,.45), 0 26px 60px -14px rgba(0,0,0,.7);
    --grid-tex: rgba(255,255,255,.05);
  }
}
/* --- dark: explicit choice --- */
:root[data-theme="dark"]{
  --paper:#060F0E; --paper-2:#0A1917; --surface:#0E1B19; --surface-2:#122320;
  --surface-3:#172C29; --line:#1E3430; --line-soft:#182A27;
  --ink:#E8F2EF; --ink-2:#9DB5B0; --ink-3:#7C9994;   /* was #6E8A85: 3.95:1 on surface-3 */
  --teal-100:#0C3A36; --teal-050:#0A2B29; --teal-700:#14B39A; --teal-600:#10D0A8;
  --amber-100:#43260F; --amber-050:#2A1A0C; --amber-700:#FFB347; --amber-600:#FF8A3D;
  --ok-bg:#0B3A2F; --warn-bg:#3A2A0C; --bad-bg:#3D1A1C;
  --ok:#3DD6A8; --warn:#F5B851; --bad:#FF7B80;
  --grad-bench: linear-gradient(160deg,#062522 0%,#083C36 45%,#0B5A52 100%);
  --pthumb-bg:#E9F0EE; --pthumb-line:rgba(255,255,255,.14);
  /* brand chips: the wash deepens, the mark lightens, the solids calm down */
  --blogo-bg-mix:24%; --blogo-bg-base:#0B1816; --blogo-edge:42%;
  --blogo-ink-mix:52%; --blogo-ink-base:#FFFFFF;
  --blogo-solid-mix:84%; --blogo-solid-base:#09110F;
  --blogo-neutral-bg:#182A27; --blogo-neutral-ink:#E8F2EF;
  --grad-header:
    radial-gradient(1100px 340px at 70% -120px, rgba(18,196,160,.24), transparent 68%),
    linear-gradient(180deg, rgba(255,255,255,.04) 0%, rgba(0,0,0,.34) 100%),
    linear-gradient(100deg,
      #021D1A 0%, #04302B 18%, #073F38 38%, #0C6558 57%, #063C36 79%, #021D1A 100%);
  --sh-1: 0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
  --sh-2: 0 2px 4px rgba(0,0,0,.4), 0 10px 26px -6px rgba(0,0,0,.55);
  --sh-3: 0 6px 12px rgba(0,0,0,.45), 0 26px 60px -14px rgba(0,0,0,.7);
  --grid-tex: rgba(255,255,255,.05);
}

/* ============================================================ RESET */
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--f-ui); font-size:15px; line-height:1.55;
  font-weight:500; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
img,svg{ display:block; max-width:100%; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ background:none; border:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
a{ color:inherit; text-decoration:none; }
h1,h2,h3,h4{ margin:0; font-family:var(--f-display); font-weight:700; letter-spacing:-.022em; text-wrap:balance; line-height:1.14; }
p{ margin:0; }
ul{ margin:0; padding:0; list-style:none; }
:focus-visible{ outline:2px solid var(--teal-500); outline-offset:2px; border-radius:6px; }
::selection{ background:var(--teal-100); color:var(--ink); }

.app{ min-height:100dvh; display:flex; flex-direction:column; }
.shell{ width:100%; max-width:var(--shell); margin-inline:auto; padding-inline:var(--pad); }
.mono{ font-family:var(--f-mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
.tnum{ font-variant-numeric:tabular-nums; }
.sr{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.scroll-x{ overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:thin; }
.scroll-x::-webkit-scrollbar{ height:6px; }
.scroll-x::-webkit-scrollbar-thumb{ background:var(--line); border-radius:99px; }
.stack{ display:flex; flex-direction:column; }
.row{ display:flex; align-items:center; }
.wrap{ flex-wrap:wrap; }
.grow{ flex:1 1 auto; min-width:0; }

/* ============================================================ TYPE SCALE */
.t-hero{ font-family:var(--f-display); font-size:clamp(28px,6.2vw,50px); font-weight:800; line-height:1.04; letter-spacing:-.03em; }
.t-h1{ font-size:clamp(21px,4.2vw,30px); font-weight:700; }
.t-h2{ font-size:clamp(17px,3vw,22px); font-weight:700; }
.t-h3{ font-size:16px; font-weight:700; font-family:var(--f-display); letter-spacing:-.015em; }
.t-lab{ font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-family:var(--f-ui); }
.t-sub{ color:var(--ink-2); font-size:14.5px; font-weight:500; line-height:1.6; }
.t-xs{ font-size:12.5px; color:var(--ink-2); }
.muted{ color:var(--ink-3); }

/* ============================================================ BUTTONS */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height:44px; padding:0 18px; border-radius:var(--r-sm);
  font-weight:700; font-size:14.5px; letter-spacing:-.005em;
  border:1px solid transparent; white-space:nowrap;
  transition:transform .16s cubic-bezier(.2,.8,.3,1), box-shadow .18s, background .18s, border-color .18s, color .18s;
}
.btn:active{ transform:translateY(1px) scale(.99); }
.btn svg{ width:18px; height:18px; flex:none; }
.btn--primary{ background:var(--grad-brand); color:#fff; box-shadow:var(--glow-brand); }
.btn--primary:hover{ box-shadow:0 14px 40px -10px rgba(15,118,110,.62); }
.btn--amber{ background:var(--grad-amber); color:#2A1405; box-shadow:var(--glow-amber); }
.btn--amber:hover{ box-shadow:0 14px 40px -10px rgba(228,113,28,.6); }
.btn--solid{ background:var(--ink); color:var(--paper); }
.btn--soft{ background:var(--teal-050); color:var(--teal-700); border-color:var(--teal-100); }
.btn--soft:hover{ background:var(--teal-100); }
.btn--outline{ background:var(--surface); color:var(--ink); border-color:var(--line); box-shadow:var(--sh-1); }
.btn--outline:hover{ border-color:var(--ink-3); }
.btn--ghost{ background:transparent; color:var(--ink-2); }
.btn--ghost:hover{ background:var(--surface-3); color:var(--ink); }
.btn--sm{ height:36px; padding:0 13px; font-size:13.5px; border-radius:var(--r-xs); }
.btn--sm svg{ width:16px; height:16px; }
.btn--lg{ height:52px; padding:0 24px; font-size:16px; border-radius:var(--r); }
.btn--block{ width:100%; }
.btn--icon{ width:40px; height:40px; padding:0; border-radius:var(--r-xs); }
.btn[disabled]{ opacity:.5; pointer-events:none; }

/* ============================================================ SURFACES */
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--sh-1); }
.card--pad{ padding:18px; }
@media (min-width:768px){ .card--pad{ padding:22px; } }
.divider{ height:1px; background:var(--line-soft); border:0; margin:0; }

.pill{
  display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 10px;
  border-radius:var(--r-pill); font-size:12px; font-weight:700; letter-spacing:-.005em;
  background:var(--surface-3); color:var(--ink-2); border:1px solid transparent;
}
.pill svg{ width:13px; height:13px; }
.pill--ok{ background:var(--ok-bg); color:var(--ok); }
.pill--warn{ background:var(--warn-bg); color:var(--warn); }
.pill--bad{ background:var(--bad-bg); color:var(--bad); }
.pill--brand{ background:var(--teal-050); color:var(--teal-700); border-color:var(--teal-100); }
.pill--amber{ background:var(--amber-050); color:var(--amber-700); border-color:var(--amber-100); }
.pill--code{ font-family:var(--f-mono); font-size:11.5px; letter-spacing:-.02em; }

/* ============================================================ BRAND MARK */
.logo{ display:flex; align-items:center; gap:10px; }
.logo__mark{ width:36px; height:36px; border-radius:11px; flex:none; box-shadow:var(--glow-brand); }
.logo__word{
  font-family:var(--f-display); font-weight:800; font-size:15.5px;
  letter-spacing:-.032em; line-height:1.05; white-space:nowrap;
}
.logo__word em{ font-style:normal; color:var(--teal-700); }

/* ============================================================ TOPBAR */
.topbar{
  position:sticky; top:0; z-index:60; height:var(--topbar-h);
  /* the header sweep, sized to header + strip so both share one gradient */
  background-image:var(--grad-header);
  background-size:100% var(--hdr-span);
  background-repeat:no-repeat;
  background-position:0 0;
  background-color:#04302B;
  border-bottom:0;
  color:var(--hdr-ink);
}

/* ---- controls colour-managed for the green gradient ---- */
.topbar .logo__word{ color:var(--hdr-ink); }
.topbar .logo__word em{ color:var(--hdr-accent); }
.topbar .logo__mark{
  box-shadow:0 0 0 1px rgba(255,255,255,.24), 0 6px 18px rgba(0,0,0,.35);
}
.topbar .nav__a{ color:var(--hdr-ink-2); }
.topbar .nav__a:hover{ background:var(--hdr-fill); color:var(--hdr-ink); }
.topbar .nav__a.is-on{ background:var(--hdr-fill-2); color:var(--hdr-ink); }
.topbar .iconbtn{ color:var(--hdr-ink-2); }
.topbar .iconbtn:hover{ background:var(--hdr-fill); color:var(--hdr-ink); }
.topbar .avatar{ box-shadow:0 0 0 2px rgba(255,255,255,.32); }
.topbar .btn--primary{
  background:#fff; color:var(--teal-900);
  box-shadow:0 6px 18px -6px rgba(0,0,0,.45);
}
.topbar .btn--primary:hover{ background:#EAFBF6; box-shadow:0 8px 22px -6px rgba(0,0,0,.5); }
.topbar :focus-visible{ outline-color:#fff; }
.topbar__in{ height:100%; display:flex; align-items:center; gap:14px; min-width:0; }
.topbar .logo{ min-width:0; flex:none; }
.topbar .logo__word{ white-space:nowrap; }

/* header search + stats — desktop only; the hero serves smaller screens */
.topbar__search{ display:none; }
.topbar__stats{ display:none; }

/* narrow phones: drop the byline and the header filter (the toolbar has one) */
@media (max-width:560px){
  .topbar__in{ gap:10px; }
  .logo__word{ font-size:14px; }
  .logo__mark{ width:32px; height:32px; border-radius:10px; }
  .topbar__end [data-act="open-filters"]{ display:none; }
}

.topbar__lead{ display:flex; align-items:center; gap:14px; min-width:0; }

/* ---- full-width application header ---- */
@media (min-width:1180px){
  .topbar .shell{ max-width:none; padding-inline:22px; }
  /* logo · search · stats · actions, all on one row */
  .topbar__in{ display:flex; gap:14px; }
  .topbar__lead{ gap:10px; flex:none; }
  .nav{ margin-left:0; }
  /* minimal header: nav collapses to icons so the search stays centred */
  .nav__a span{ display:none; }
  .nav__a{ padding:0 11px; }
  .topbar__end{ margin-left:0; flex:none; }
  .topbar__search{ display:block; min-width:0; flex:1 1 auto; max-width:620px; margin-inline:auto; }

  /* ---- statistics, inline beside the search ---- */
  .topbar__stats{ display:flex; align-items:center; flex:none; }
  .topbar__stats .bstat{
    background:transparent; border:0; border-radius:0; backdrop-filter:none;
    border-left:1px solid var(--hdr-line);
    padding:1px 0 1px 13px; margin-left:13px; min-width:0; text-align:right;
  }
  .topbar__stats .bstat:first-child{ border-left:0; margin-left:0; padding-left:0; }
  .topbar__stats .bstat b{
    font-size:15px; line-height:1.15; color:var(--hdr-ink); letter-spacing:-.02em;
  }
  .topbar__stats .bstat span{ font-size:9px; letter-spacing:.09em; color:var(--hdr-ink-2); }
  /* minimal open-listing affordance beside PRODUCTS */
  .bstat__link{
    display:inline-flex; align-items:center; vertical-align:-1px; margin-left:4px;
    color:inherit; opacity:.7; transition:opacity .15s, color .15s, transform .15s;
  }
  .bstat__link svg{ width:9.5px; height:9.5px; stroke-width:2.2; }
  .bstat__link:hover{ opacity:1; color:var(--hdr-ink); transform:translate(1px,-1px); }
  /* tablet-width desktops keep the two headline counters only */
  @media (max-width:1319px){
    .topbar__stats .bstat:nth-child(n+3){ display:none; }
  }
  .topbar__search .searchwrap{ margin-top:0; }
  /* light field on the gradient — fixed literals, never theme tokens, because
     the surface under it is green in both themes */
  .topbar__search .search{
    height:42px; padding:0 6px 0 13px; border-radius:var(--r-sm);
    background:rgba(255,255,255,.94); border:1px solid rgba(255,255,255,.5);
    box-shadow:0 2px 10px rgba(0,0,0,.16);
  }
  .topbar__search .search:focus-within{
    background:#fff; border-color:#fff;
    box-shadow:0 4px 16px rgba(0,0,0,.2), 0 0 0 3px rgba(255,255,255,.34);
  }
  .topbar__search .search__ico{ color:#0F766E; }
  .topbar__search .search input{ font-size:14.5px; font-weight:600; color:#0A1512; }
  .topbar__search .search input::placeholder{ color:#5F7B76; font-weight:500; }
  .topbar__search .search__ico svg{ width:18px; height:18px; }
  .topbar__search .search__clear{
    width:26px; height:26px; background:#E3ECEA; color:#3F5A55;
  }
  .topbar__search .search__clear:hover{ background:#CFE0DC; color:#0A1512; }
  .topbar__search .search__go{ display:none; }
  .topbar__end{ gap:6px; flex:none; }
}
@media (min-width:1560px){

  .topbar__search{ max-width:720px; }
  .topbar__stats .bstat{ padding-left:16px; margin-left:16px; }
}
.nav{ display:none; gap:2px; margin-left:14px; }
@media (min-width:940px){ .nav{ display:flex; } }
.nav__a{
  display:inline-flex; align-items:center; gap:8px; height:38px; padding:0 14px;

.iconbtn{

.avatar{
  width:38px; height:38px; border-radius:var(--r-pill); display:grid; place-items:center;
  font-weight:800; font-size:13px; color:#fff; background:var(--grad-brand); flex:none;
}

/* ============================================================ BOTTOM TABS (mobile) */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:70;

/* ============================================================ BENCH HERO */
.bench{
  /* overflow stays visible so the search dropdown can extend past the hero;
     the warm glow is a background layer (not a spilling pseudo-element) */
  position:relative; overflow:visible; color:#EAFBF6;
  background-image:
    radial-gradient(420px 420px at calc(100% + 60px) -150px, rgba(255,138,61,.30), transparent 62%),

}
@media (min-width:768px){ .bench{ padding:38px 0 42px; } }
.bench::before{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:34px 34px;
  mask-image:radial-gradient(120% 80% at 50% 0%,#000 20%,transparent 78%);
  -webkit-mask-image:radial-gradient(120% 80% at 50% 0%,#000 20%,transparent 78%);
}
.bench__in{ position:relative; z-index:1; }
.bench__eyebrow{

  border-radius:var(--r-pill); background:rgba(255,255,255,.1);

  backdrop-filter:blur(6px);
}

.bench h1{ margin-top:14px; color:#fff; }
.bench h1 em{ font-style:normal; background:linear-gradient(100deg,#FFB347,#FFD9A8); -webkit-background-clip:text; background-clip:text; color:transparent; }
.bench__sub{ margin-top:10px; color:rgba(226,250,244,.78); font-size:14.5px; max-width:56ch; line-height:1.6; }
@media (min-width:768px){ .bench__sub{ font-size:16px; } }

.bench__stats{ display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
.bstat{
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
  border-radius:var(--r); padding:9px 14px; backdrop-filter:blur(8px); min-width:96px;
}
.bstat b{ display:block; font-family:var(--f-display); font-size:21px; font-weight:800; letter-spacing:-.03em; color:#fff; font-variant-numeric:tabular-nums; }
.bstat span{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.7); }

/* ============================================================ SEARCH */
/* above the sticky filter bar (z-40) so the dropdown is never covered */
.searchwrap{ position:relative; margin-top:20px; z-index:55; }
.search{
  position:relative; overflow:hidden;
  display:flex; align-items:center; gap:10px; height:56px; padding:0 8px 0 16px;
  background:var(--surface); border-radius:var(--r); border:1px solid transparent;
  box-shadow:0 18px 44px -16px rgba(3,26,23,.55), 0 2px 0 rgba(255,255,255,.08);
  transition:box-shadow .2s, border-color .2s;
}
/* soft light reflection travelling across the field — decorative only, sits
   above the background and below nothing interactive */
.search::after{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(104deg,
    transparent 38%,
    rgba(16,208,168,.16) 47%,
    rgba(255,255,255,.62) 50%,
    rgba(16,208,168,.16) 53%,
    transparent 62%);
  transform:translate3d(-130%,0,0);
  will-change:transform;
  animation:sheen 6.5s cubic-bezier(.45,0,.25,1) infinite;
}
@keyframes sheen{
  0%   { transform:translate3d(-130%,0,0); }
  42%  { transform:translate3d(130%,0,0); }
  100% { transform:translate3d(130%,0,0); }
}
/* never compete with the user while they are typing */
.search:focus-within::after{ animation:none; opacity:0; }
@media (prefers-reduced-motion: reduce){ .search::after{ animation:none; opacity:0; } }
@media (min-width:768px){ .search{ height:64px; padding-left:20px; border-radius:var(--r-lg); } }
.search:focus-within{ border-color:var(--teal-400); box-shadow:0 18px 50px -14px rgba(3,26,23,.6), 0 0 0 4px rgba(20,179,154,.22); }
.search__ico{ color:var(--teal-700); flex:none; }
.search__ico svg{ width:21px; height:21px; }
.search input{
  flex:1; min-width:0; border:0; background:transparent; outline:none;
  font-size:16px; font-weight:600; letter-spacing:-.01em; color:var(--ink);
}
@media (min-width:768px){ .search input{ font-size:17.5px; } }
.search input::placeholder{ color:var(--ink-3); font-weight:500; }
.search__clear{ width:32px; height:32px; border-radius:var(--r-pill); display:grid; place-items:center; color:var(--ink-3); background:var(--surface-3); }
.search__clear svg{ width:15px; height:15px; }
.search__go{ display:none; }
@media (min-width:560px){ .search__go{ display:inline-flex; } }

.suggest{
  position:absolute; left:0; right:0; top:calc(100% + 10px); z-index:40;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  /* explicit: the panel sits inside the hero / header, both of which set a
     light-on-dark text colour that would otherwise be inherited onto white */
  color:var(--ink);
  box-shadow:var(--sh-3); overflow:hidden; max-height:min(62vh,460px); overflow-y:auto;
  animation:pop .16s cubic-bezier(.2,.9,.3,1);
}
@keyframes pop{ from{ opacity:0; transform:translateY(-6px) scale(.99); } }
.suggest__head{ padding:10px 16px 6px; display:flex; align-items:center; justify-content:space-between; }
.sug{
  display:flex; align-items:center; gap:12px; width:100%; padding:12px 14px; text-align:left;
  color:var(--ink);
  border-bottom:1px solid var(--line-soft); transition:background .12s;
}
.sug:last-child{ border-bottom:0; }
.sug:hover,.sug.is-cursor{ background:var(--teal-050); }
.sug__body{ min-width:0; flex:1; display:flex; flex-direction:column; gap:3px; }
/* primary: the model name — always full-contrast ink */
.sug__name{
  color:var(--ink); font-weight:700; font-size:15px; line-height:1.3;
  letter-spacing:-.012em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
/* the typed fragment is tinted, never lighter than the rest of the name */
.sug__name mark{
  background:var(--teal-050); color:var(--teal-700); font-weight:800;
  border-radius:3px; padding:0 1px;
}
/* secondary: brand · display · year — readable, clearly below the name */
.sug__meta{
  font-size:12.5px; color:var(--ink-2); font-weight:600;
  display:flex; gap:8px; align-items:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.sug__meta i{ font-style:normal; width:3px; height:3px; border-radius:99px; background:var(--ink-3); display:inline-block; }
.sug__go{ color:var(--ink-3); flex:none; }
.sug__go svg{ width:16px; height:16px; }

/* ---- brand chips --------------------------------------------------------
   THE BOUNDING BOX, not the logo, is what is consistent. Every chip is the
   same size in a given context; what goes inside it is contained, never
   stretched — so a wide wordmark stays wide, a square mark stays square, and
   the rail still lines up. The box is slightly wider than tall for exactly
   that reason: most manufacturer logos are wordmarks. */
.blogo{
  --bmk:#0E7A6C;
  width:42px; height:38px; border-radius:11px; flex:none;
  display:grid; place-items:center; overflow:hidden;
  font-family:var(--f-display); font-weight:800; font-size:14px; color:#fff; letter-spacing:-.02em;
  transition:background .16s, border-color .16s, color .16s;
}
.blogo--lg{ width:62px; height:56px; border-radius:var(--r); font-size:20px; }
.blogo--sm{ width:32px; height:28px; border-radius:8px; font-size:11px; }
/* the brand rail on the finder: the one place a logo is the subject rather
   than a marker beside a name, so it gets the room to actually be read */
.blogo--rail{ width:48px; height:40px; border-radius:10px; }

/* Logo artwork fills its box generously — the old chips gave 8px of padding to
   a 28px square and left 16px of logo, which is why Motorola looked like a
   speck. Padding stays absolute, never a percentage: percentage padding
   resolves against the CONTAINING BLOCK's width, not the chip's, which on a
   wide card swallowed the whole chip and left the logo 0px tall. */
.blogo--img,.blogo--mark,.blogo--word{ padding:4px; }
.blogo--lg.blogo--img,.blogo--lg.blogo--mark,.blogo--lg.blogo--word{ padding:8px; }
.blogo--sm.blogo--img,.blogo--sm.blogo--mark,.blogo--sm.blogo--word{ padding:3px; }
.blogo--rail.blogo--img,.blogo--rail.blogo--mark,.blogo--rail.blogo--word{ padding:4px; }

.blogo--img img{ width:100%; height:100%; object-fit:contain; display:block; }
/* No width/height attributes on these — the box is the bound and the SVG's own
   preserveAspectRatio contains the artwork inside it. */
.blogo--mark svg,.blogo--word svg{ width:100%; height:100%; display:block; }
.blogo--mark svg path{ fill:currentColor; }
.blogo--word text{
  font-family:var(--f-display); font-weight:800; letter-spacing:-.02em; fill:currentColor;
}

/* --- the three treatments, both themes ---------------------------------- */
/* tint: a pale wash of the brand's own colour, mark in that colour. The
   default, and what most brands should be — a rail of saturated blocks is not
   a product, it is a bag of sweets. */
.blogo--tint{
  background:color-mix(in srgb, var(--bmk) var(--blogo-bg-mix), var(--blogo-bg-base));
  border:1px solid color-mix(in srgb, var(--bmk) var(--blogo-edge), transparent);
  color:color-mix(in srgb, var(--bmk) var(--blogo-ink-mix), var(--blogo-ink-base));
}
/* solid: the brand colour IS the identity — OnePlus red, Nokia blue, Huawei
   red — so the chip carries it and the mark reverses out in white. */
.blogo--solid{
  background:color-mix(in srgb, var(--bmk) var(--blogo-solid-mix), var(--blogo-solid-base));
  border:1px solid color-mix(in srgb, var(--bmk) 70%, transparent);
  color:#FFFFFF;
}
/* mono: monochrome identities (Apple, Honor, ASUS, Nothing, Sony). Their
   official colour is black or white, so it is the THEME's ink that keeps them
   visible — a black Apple mark on a black page is not a brand treatment. */
.blogo--mono{
  background:var(--blogo-neutral-bg); border:1px solid var(--line);
  color:var(--blogo-neutral-ink);
}
/* A logo file is someone else's artwork with its own ground baked in, so it
   gets a plain light chip in both themes rather than a tint that would fight
   whatever is inside the file. */
.blogo--img{ background:var(--pthumb-bg); border:1px solid var(--line); }

/* history marker for recent-search rows in the dropdown */
.sug__hist{
  width:38px; height:38px; border-radius:11px; flex:none; display:grid; place-items:center;
  background:var(--surface-3); color:var(--ink-3);
}
.sug__hist svg{ width:18px; height:18px; }
.sug:hover .sug__hist,.sug.is-cursor .sug__hist{ background:var(--teal-100); color:var(--teal-700); }

.quick{
  flex:none; height:32px; padding:0 13px; border-radius:var(--r-pill);
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16);
  color:#FFFFFF; font-size:12.5px; font-weight:700; transition:background .16s,transform .16s;
}
.quick:hover{ background:rgba(255,255,255,.2); }


/* === assets/components.css === */
/* ============================================================
   Mobile Parts Finder — Feature components
   ============================================================ */

/* ---------------- section heading ---------------- */
.sec{ margin-top:26px; }
@media (min-width:768px){ .sec{ margin-top:34px; } }
.sec__head{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
.sec__title{ display:flex; align-items:center; gap:9px; }
.sec__title h2{ font-size:clamp(18px,3vw,23px); }
.sec__count{
  font-family:var(--f-mono); font-size:12px; font-weight:600; color:var(--ink-3);
  background:var(--surface-3); padding:3px 8px; border-radius:var(--r-xs);
}

/* ============================================================
   WORKSPACE — full-width 3-panel desktop dashboard
   Below --ws-bp the exact same markup collapses to the original
   single-column page: side panels hide and move into the filter
   sheet, the horizontal category row and mobile toolbar return.
   ============================================================ */
.ws{ display:block; }
.ws__body{ display:block; }
.ws__left,.ws__right{ display:none; }
.ws__center{ max-width:var(--shell); margin-inline:auto; padding-inline:var(--pad); }
.ws-only{ display:none; }

@media (min-width:1180px){
  .main.is-ws{ padding-bottom:0; }

  /* the page itself no longer scrolls — the centre column does */
  .ws{
    height:calc(100dvh - var(--topbar-h));
    display:flex; flex-direction:column;
  }

  /* the hero band is gone on desktop — its search, stats and recent searches
     now live in the compact application header (recents in the dropdown) */
  .ws__band{ display:none; }

  .ws__body{
    flex:1 1 auto; min-height:0;
    display:grid; grid-template-columns:288px minmax(0,1fr) 244px;
  }
  .ws__left,.ws__right{
    display:block; min-height:0; overflow-y:auto; overscroll-behavior:contain;
    background:var(--surface); padding:14px 13px 24px;
  }
  .ws__left{ border-right:1px solid var(--line); }
  .ws__right{ border-left:1px solid var(--line); }
  .ws__center{
    min-width:0; min-height:0; overflow-y:auto; overscroll-behavior:contain;
    max-width:none; margin:0; padding:0 20px 36px; background:var(--paper);
  }
  .ws__left::-webkit-scrollbar,
  .ws__right::-webkit-scrollbar,
  .ws__center::-webkit-scrollbar{ width:9px; }
  .ws__left::-webkit-scrollbar-thumb,
  .ws__right::-webkit-scrollbar-thumb,
  .ws__center::-webkit-scrollbar-thumb{ background:var(--line); border-radius:99px; border:2px solid transparent; background-clip:content-box; }

  /* the panels replace these on desktop */
  .ws__center .fbar{ display:none; }
  .ws-only{ display:block; }
  .ws-tools .field{ width:230px; }

  /* flatten the head wrappers so the toolbar's containing block is the
     scroll container itself — otherwise position:sticky can only travel
     as far as its short parent box and scrolls away with it */
  .ws__center .ws__head,
  .ws__center .ws__head .sec{ display:contents; }
  .ws__center .sec__head{
    position:sticky; top:0; z-index:6; margin:0 0 12px;
    padding:14px 0 10px; background:var(--paper);
    box-shadow:0 10px 12px -12px rgba(10,21,18,.35);
  }
  /* card columns follow the real column width, not the viewport width */
  .ws__center .gridcards{ grid-template-columns:repeat(auto-fill,minmax(262px,1fr)); }
}

@media (min-width:1560px){
  .ws__body{ grid-template-columns:322px minmax(0,1fr) 274px; }
  .ws__left,.ws__right{ padding:18px 16px 28px; }
  .ws__center{ padding:0 26px 40px; }
  .ws__band .shell{ padding-inline:26px; }
}

/* ---------------- panel shell (used by both sidebars and the sheet) ------- */
.panel__head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; min-height:24px; }
.panel__n{ font-family:var(--f-mono); font-size:11px; color:var(--ink-3); background:var(--surface-3); padding:2px 7px; border-radius:6px; }
.panel__clear{ display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:700; color:var(--ink-3); padding:3px 7px; border-radius:6px; }
.panel__clear:hover{ background:var(--surface-3); color:var(--ink); }
.panel__clear svg{ width:12px; height:12px; }
.panel + .panel{ margin-top:16px; padding-top:16px; border-top:1px solid var(--line-soft); }

/* --------- the selected model, as the head of the CENTRE column ----------
   It is a heading for the matches underneath it, not a page of its own: the
   category panel and the brand panel stay mounted either side of it and keep
   narrowing the same result. */
.selmodel{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:14px 16px; margin-bottom:14px;
  background:var(--surface-2); border:1px solid var(--line);
  border-radius:var(--r-lg);
}
.selmodel .t-h3{ font-size:clamp(16px,2.4vw,20px); line-height:1.22; }
@media (max-width:520px){
  .selmodel{ padding:12px; gap:10px; }
  .selmodel .blogo--lg{ width:50px; height:44px; }
}

/* a category this model has no group in: still in its place, plainly off */
.ctile.is-empty{ opacity:.4; pointer-events:none; }

/* --------- LEFT: image-first category gallery, 3 up -----------------------
   The picture is the tile. Every cell is the same square, always three to a
   row — including the last real category, which used to stretch to full width
   and broke the grid's rhythm the moment Battery happened to be last. The "+"
   slot is an ordinary cell, so adding a category cannot change the shape of
   the ones already there.

   The name is not printed under the picture. Seven tiles each captioned with
   its own name and the word "groups" is a wall of text over a gallery; the
   name appears on hover, over the lower edge of its own image, and lives in
   the button's aria-label the rest of the time so nothing is hidden from a
   screen reader or a keyboard. */
.ctiles{ --cols:3; display:grid; grid-template-columns:repeat(var(--cols),minmax(0,1fr)); gap:8px; }
.ctiles--2{ --cols:2; }
.ctiles--3{ --cols:3; }
/* Below this the sidebar is not the sidebar any more — it is the filter
   sheet, where the column choice still applies but two-up is the floor. */
@media (max-width:359px){ .ctiles{ --cols:2; } }
/* White, in both themes, and flat. The card is a mount for a white-background
   photograph: a tinted ground or a drop shadow reads as grime around the part
   rather than as depth, and it is the first thing you see when you zoom in. */
.ctile{
  --c:var(--teal-500);
  position:relative; display:block; padding:4px; border-radius:var(--r-sm);
  border:1px solid var(--line); background:var(--ctile-paper); color:var(--ink);
  transition:transform .18s cubic-bezier(.2,.8,.3,1), border-color .18s;
}
.ctile:hover{ transform:translateY(-2px); border-color:var(--c); }
.ctile:focus-visible{ outline:2px solid var(--teal-600); outline-offset:2px; }

/* The image area — and the positioning context the overlay and the badge are
   measured against.

   Portrait, because the parts are portrait: a back cover, a display, a middle
   frame and a battery are all far taller than they are wide, and a square box
   spent most of its area on white to either side of them. 3:4 is measured
   against the assets — it is the ratio at which the tallest part (a display,
   0.44) still clears 88% of the height while the one wide part (a CC board,
   1.27) still fits across without being shrunk to fit a height it does not
   need. Changing it means re-running scripts/build-category-focus.py with a
   matching --aspect. */
.ctile__art{
  position:relative; display:block; width:100%; aspect-ratio:3/4;
  border-radius:9px; overflow:hidden;
}

/* ---- product renders (one system: category tiles + group cards) ---------- */
.pthumb{
  display:grid; place-items:center; flex:none; overflow:hidden;
  background:var(--pthumb-bg); border:1px solid var(--pthumb-line); border-radius:10px;
  box-shadow:inset 0 -6px 12px -8px rgba(10,21,18,.18);
}
.pimg{ width:100%; height:100%; display:block; object-fit:contain; }
/* Fills its cell instead of sitting as a 56px stamp in the middle of one.

   The shared .pthumb carries an inset bottom shadow, which gives a small
   thumbnail a sense of a shelf. Across a whole tile it is just a grey wash
   over the lower third of the photograph — the smudge under every part in the
   sidebar. Off here, and left alone everywhere else it is still small. */
.pthumb--tile{
  position:absolute; inset:0; width:100%; height:100%; max-width:none;
  border-radius:9px; border-color:transparent; padding:0;
  background:var(--ctile-paper); box-shadow:none;
}
/* FIT THE PART, NOT ITS CANVAS.

   The masters are square pictures of a portrait part standing in a lot of
   white — a back cover is 45% of its own canvas, a display 42%. `contain`
   fits the canvas, so those parts render under half a tile wide however big
   the tile gets; enlarging the card cannot fix it, because the card is not
   what is being fitted.

   --iw / --il / --it place the image so the PART lands centred and filling
   the box, measured per asset by scripts/build-category-focus.py. Only the
   width is set and the height is auto, so the browser derives the height from
   the file's own aspect ratio and DISTORTION IS NOT EXPRESSIBLE here. The
   overhang is the asset's white margin, clipped against a white chip, so
   nothing of the part is lost and no edge shows.

   The fallback values are plain contain behaviour, which is what a category
   with no measurement — or the drawn SVG stand-in — should get. */
.pthumb--tile img.pimg{
  position:absolute;
  width:var(--iw,100%); height:auto;
  /* The global img{max-width:100%} reset in styles.css caps an image at its
     container, which is exactly what has to be overridden here: the image is
     deliberately WIDER than the tile so the part inside it is not. Without
     this the width silently clamps back to 100% and every part returns to
     canvas size — the same picture, and no visible error to chase. */
  max-width:none;
  left:var(--il,0); top:var(--it,0);
  object-fit:contain;
}
/* the drawn stand-in has no canvas margin to correct for */
.pthumb--tile svg.pimg{ width:100%; height:100%; padding:8%; }
.pthumb--plate{ width:58px; height:58px; border-radius:12px; }

/* Hover reveal. Only the bottom of the picture is shaded — enough to carry a
   line of text, not a curtain over the thing the tile is for. */
.ctile__veil{
  position:absolute; left:0; right:0; bottom:0; height:56%; pointer-events:none;
  background:linear-gradient(to top, rgba(5,14,13,.88) 0%, rgba(5,14,13,.55) 42%, rgba(5,14,13,0) 100%);
  opacity:0; transition:opacity .2s ease;
}
.ctile__name{
  position:absolute; left:6px; right:6px; bottom:6px; pointer-events:none;
  font-size:10.5px; font-weight:700; line-height:1.2; letter-spacing:-.01em;
  color:#FFFFFF; text-align:left; text-shadow:0 1px 2px rgba(0,0,0,.5);
  opacity:0; transform:translateY(4px); transition:opacity .2s ease, transform .2s ease;
  overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
}
/* Two-up tiles are wide enough for the longer names to sit on one line, so
   the type grows with the card rather than staying at sidebar size. */
.ctiles--2 .ctile__name{ font-size:12px; left:8px; right:8px; bottom:7px; }
.ctiles--2 .ctile__n{ height:20px; min-width:22px; font-size:11px; }
/* EVERYTHING that is not the picture appears only under the pointer.

   Selection is deliberately NOT in this list. A selected tile shows its
   outline and nothing else: the name and the count are what you look up while
   choosing, and repeating them on the one tile you have already chosen is the
   clutter this panel is trying to lose. Hovering a selected tile still brings
   them back, because that is you asking again. */
.ctile:hover .ctile__veil,
.ctile:focus-visible .ctile__veil{ opacity:1; }
.ctile:hover .ctile__name,
.ctile:focus-visible .ctile__name{ opacity:1; transform:none; }
.ctile:hover .ctile__n,
.ctile:focus-visible .ctile__n{ opacity:1; transform:none; }

/* Without a pointer there is no hover at all, so hover-only would put the
   name and the count permanently out of reach on a phone. There they stay
   on — softer, and only where a mouse was never going to arrive. */
@media (hover:none){
  .ctile__veil{ opacity:.92; }
  .ctile__name{ opacity:1; transform:none; }
  .ctile__n{ opacity:1; transform:none; }
}

/* The count, as a floating badge and nothing else — the number, never the
   word, and only under the pointer. It sits ON the picture, whose ground is
   white in both themes, so it is painted against the artwork rather than the
   page: a dark translucent pill reads the same in light and dark, where a
   surface token would have gone white-on-white in one of them. */
.ctile__n{
  position:absolute; top:2px; right:2px; z-index:2; pointer-events:none;
  min-width:20px; height:18px; padding:0 5px; border-radius:99px;
  display:grid; place-items:center;
  font-size:10px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums;
  background:rgba(9,20,18,.74); color:#FFFFFF; border:1px solid rgba(255,255,255,.2);
  opacity:0; transform:translateY(-3px);
  transition:opacity .2s ease, transform .2s ease;
}
.ctile.is-empty .ctile__n{ background:rgba(9,20,18,.42); }
/* Selected: the category's own colour, drawn as the card's edge and nothing
   more. The inset ring is the same border doubled, not a glow — it thickens
   the outline to 2px without softening it or tinting the white the photograph
   needs. There is no tick: on a grid where exactly one card can be outlined in
   colour, a badge saying so is a second answer to a question already
   answered, and it lands on top of the picture. */
.ctile.is-on{
  border-color:var(--c); box-shadow:0 0 0 1px var(--c) inset;
}

/* The "+" slot: the same cell, plainly empty. A dashed edge says "nothing here
   yet" without borrowing the weight of a real category. */
.ctile--add{ background:transparent; border-style:dashed; color:var(--ink-3); }
.ctile--add:hover{ border-color:var(--teal-600); color:var(--teal-700); background:var(--teal-050); }
.ctile--add .ctile__art{
  display:grid; place-items:center; gap:3px; align-content:center;
}
.ctiles--2 .ctile__plus svg{ width:24px; height:24px; }
.ctiles--2 .ctile__name--add{ font-size:11.5px; }

/* --- grid density control, in the panel head --------------------------- */
/* Small enough to sit beside the heading rather than becoming a settings
   panel: the two icons ARE the layouts they choose. */
.cols{
  display:inline-flex; padding:2px; gap:2px; border-radius:8px;
  background:var(--surface-3); border:1px solid var(--line);
}
.cols__opt{
  display:grid; place-items:center; width:22px; height:18px; border-radius:5px;
  color:var(--ink-3); transition:background .14s, color .14s;
}
.cols__opt svg{
  width:13px; height:13px;
  /* the icon is a pair/trio of filled bars, not an outline */
  fill:currentColor; stroke:none;
}
.cols__opt:hover{ color:var(--ink); }
.cols__opt.is-on{ background:var(--surface); color:var(--teal-700); box-shadow:var(--sh-1); }
.ctile__plus{ display:grid; place-items:center; }
.ctile__plus svg{ width:20px; height:20px; }
.ctile__name--add{
  position:static; opacity:1; transform:none; text-align:center;
  color:currentColor; text-shadow:none; font-size:10px; font-weight:700;
}

/* ---------------- RIGHT: brand explorer ---------------------------------- */
.brandsearch{ margin-bottom:9px; }
.brandsearch .input{ height:34px; font-size:13px; padding-left:33px; padding-right:30px; }
.brandsearch .field svg{ left:10px; width:15px; height:15px; }
.field__clear{
  position:absolute; right:6px; width:22px; height:22px; border-radius:99px;
  display:grid; place-items:center; background:var(--surface-3); color:var(--ink-3);
}
.field__clear:hover{ background:var(--teal-050); color:var(--teal-700); }
.field__clear svg{ position:static; width:12px; height:12px; pointer-events:none; }
.brandempty{
  display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center;
  padding:22px 10px; color:var(--ink-3); font-size:12.5px; font-weight:600;
}
.brandempty svg{ width:22px; height:22px; opacity:.7; }
.brow--empty{ opacity:.52; }
.brow--empty:hover{ opacity:.85; }

.brows{ display:flex; flex-direction:column; gap:2px; }
/* The logo is the subject of this row, so the row is sized around it rather
   than around the text. It used to give the mark a 28px chip with 6px of
   padding — 16px of actual logo, which is why Motorola read as a speck and
   Huawei as unidentifiable grey text. */
.brow{
  display:flex; align-items:center; gap:10px; width:100%; padding:5px 7px;
  border-radius:var(--r-xs); text-align:left; border:1px solid transparent;
  transition:background .14s, border-color .14s, color .14s;
}
.brow:hover{ background:var(--surface-3); }
.brow__n{ font-size:13.5px; font-weight:700; letter-spacing:-.012em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.brow__c{ margin-left:auto; font-family:var(--f-mono); font-size:11px; color:var(--ink-3); flex:none; }
.brow__all{
  width:48px; height:40px; border-radius:10px; display:grid; place-items:center; flex:none;
  background:var(--surface-3); color:var(--ink-3);
}
.brow__all svg{ width:17px; height:17px; }
.brow.is-on{ background:var(--teal-050); border-color:var(--teal-100); }
.brow.is-on .brow__n,.brow.is-on .brow__c{ color:var(--teal-700); }
.brow.is-on .brow__all{ background:var(--grad-brand); color:#fff; }

/* ---------------- filter controls ---------------- */
.field{ position:relative; display:flex; align-items:center; }
.field svg{ position:absolute; left:11px; width:17px; height:17px; color:var(--ink-3); pointer-events:none; }
.input{
  width:100%; height:42px; border-radius:var(--r-sm); border:1px solid var(--line);
  background:var(--surface-2); padding:0 12px; font-size:14.5px; font-weight:600; outline:none;
  transition:border-color .16s, box-shadow .16s, background .16s;
}
.input::placeholder{ color:var(--ink-3); font-weight:500; }
.input:focus{ border-color:var(--teal-500); background:var(--surface); box-shadow:0 0 0 3px rgba(20,179,154,.16); }
.field .input{ padding-left:36px; }
select.input{ appearance:none; cursor:pointer; padding-right:34px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 17px) 19px,calc(100% - 12px) 19px; background-size:5px 5px,5px 5px; background-repeat:no-repeat;
}
.checkline{ display:flex; align-items:center; gap:10px; padding:7px 0; font-size:14px; font-weight:600; cursor:pointer; }
.checkline input{ accent-color:var(--teal-600); width:17px; height:17px; }

/* ---- horizontal product-category rail (under the main search) ----------- */
.crail{
  display:flex; gap:8px; margin-top:16px; padding:2px 0 4px;
  overflow-x:auto; -webkit-overflow-scrolling:touch;
  scroll-snap-type:x proximity; scrollbar-width:none;
}
.crail::-webkit-scrollbar{ display:none; }
.crail__item{
  flex:none; width:78px; scroll-snap-align:start;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  padding:8px 6px 7px; border-radius:var(--r-sm);
  background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.17);
  color:#fff; text-align:center;
  transition:background .16s, border-color .16s, transform .16s cubic-bezier(.2,.8,.3,1);
}
.crail__item:hover{ background:rgba(255,255,255,.18); }
.crail__item:active{ transform:scale(.97); }
.crail__name{ font-size:10.5px; font-weight:700; line-height:1.2; letter-spacing:-.005em; }
.crail__n{ font-size:9px; font-weight:600; opacity:.72; font-variant-numeric:tabular-nums; }
.crail__item.is-on{
  background:#fff; border-color:#fff; color:var(--teal-900);
  box-shadow:0 6px 16px -8px rgba(0,0,0,.55);
}
.crail__item.is-on .crail__n{ opacity:.7; }
.pthumb--rail{ width:46px; height:46px; }

/* group filter — a plain row inside the Compatibility Groups section */
.fbar{
  display:flex; gap:8px; align-items:center; margin:0 0 14px;
}

/* ---------------- RESULT PAGE ------------------------------------------- */
/* the app header is not repeated above the result head on small screens */
@media (max-width:1179px){
  .app.is-result .topbar{ display:none; }
}
.rhead{
  position:sticky; top:0; z-index:58;
  border-radius:0; padding:10px 0 11px;
  box-shadow:0 10px 24px -18px rgba(0,0,0,.8);
}
.rhead__row{ display:flex; align-items:center; gap:10px; }
.rhead__row .searchwrap{ flex:1 1 auto; min-width:0; margin-top:0; }
.rhead__row .search{ height:48px; }
.rhead__x{
  width:48px; height:48px; flex:none; border-radius:var(--r-sm);
  display:grid; place-items:center; color:#fff;
  background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22);
  transition:background .16s, transform .16s;
}
.rhead__x:hover{ background:rgba(255,255,255,.26); }
.rhead__x:active{ transform:scale(.95); }
.rhead__x svg{ width:20px; height:20px; }
/* the result rail is a touch tighter than the home one — this block is
   sticky, so it has to stay light on a phone screen */
.rhead .crail{ margin-top:10px; }
.rhead .crail__item{ width:68px; padding:7px 5px 6px; gap:5px; }
.rhead .pthumb--rail{ width:38px; height:38px; }
.rhead .crail__name{ font-size:10px; }
.crail__item.is-empty{ opacity:.42; pointer-events:none; }
@media (min-width:1180px){
  /* the app header already carries the search up here */
  .rhead{ position:static; }
  .rhead__row .searchwrap{ display:none; }
  .rhead__row{ justify-content:flex-end; }
}

/* category block heading inside a grouped "All Parts" result */
.catgroup{
  display:flex; align-items:center; gap:10px; margin:22px 0 12px;
  padding-bottom:9px; border-bottom:2px solid color-mix(in srgb,var(--c) 35%,var(--line));
}
.catgroup:first-child{ margin-top:4px; }
.pthumb--head{ width:32px; height:32px; border-radius:9px; }
.catgroup__name{
  font-family:var(--f-display); font-size:15px; font-weight:700; letter-spacing:-.015em;
  color:color-mix(in srgb,var(--c) 62%,var(--ink)); text-transform:uppercase;
}
.catgroup__n{
  margin-left:auto; font-family:var(--f-mono); font-size:11.5px; color:var(--ink-3);
  background:var(--surface-3); padding:3px 8px; border-radius:var(--r-xs);
}
@media (min-width:1180px){ .fbar{ display:none; } }
.fbar .field{ flex:1; min-width:0; }
.fbar__btn{ position:relative; }
.fbar__btn .dotn{
  position:absolute; top:-4px; right:-4px; min-width:18px; height:18px; padding:0 5px;
  border-radius:99px; background:var(--amber-500); color:#2A1405;
  font-size:10.5px; font-weight:800; display:grid; place-items:center;
}

/* ---------------- category chips / grid ---------------- */
.cats{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
@media (min-width:560px){ .cats{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
@media (min-width:900px){ .cats{ grid-template-columns:repeat(4,minmax(0,1fr)); } }
.cat{
  position:relative; overflow:hidden; text-align:left; padding:13px 13px 12px;
  border-radius:var(--r); border:1px solid var(--line); background:var(--surface);
  box-shadow:var(--sh-1); transition:transform .18s cubic-bezier(.2,.8,.3,1), box-shadow .18s, border-color .18s;
}
.cat:hover{ transform:translateY(-2px); box-shadow:var(--sh-2); }
.cat::after{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--c); }
.pthumb--cat{ width:34px; height:34px; margin-bottom:9px; }
.cat__name{ font-weight:700; font-size:14px; letter-spacing:-.015em; line-height:1.25; }
.cat__n{ font-size:11.5px; color:var(--ink-3); font-weight:600; margin-top:3px; font-variant-numeric:tabular-nums; }
.cat.is-on{ border-color:var(--c); box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 26%,transparent), var(--sh-2); }
.cat.is-off{ opacity:.42; }
.cat__tick{ position:absolute; top:10px; right:10px; color:var(--c); opacity:0; transition:opacity .16s; }
.cat__tick svg{ width:17px; height:17px; }
.cat.is-on .cat__tick{ opacity:1; }


/* ---------------- part-label group card ---------------- */
/* ---- the two-part group feed -------------------------------------------
   A trending strip over the catalogue. The strip is a single row that scrolls
   SIDEWAYS: stacked, twelve recent groups would push the catalogue itself off
   the first screen to say something the catalogue already says. */
.feed + .feed{ margin-top:22px; }
.feed__head{
  display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:0 0 11px;
}
.feed__title{
  display:flex; align-items:center; gap:7px; margin:0;
  font-family:var(--f-display); font-size:15px; font-weight:800; letter-spacing:-.015em;
}
.feed__title svg{ width:15px; height:15px; color:var(--amber-600); }
.feed__note{ font-size:11.5px; font-weight:600; color:var(--ink-3); }
.feed__head--rest{
  padding-top:16px; border-top:1px solid var(--line-soft);
}

/* Cards keep their real width and run off the edge, which is what tells the
   reader there is more to the right. Only this element scrolls — the page
   never gains a horizontal scrollbar, because the row is the overflow
   container and min-width:0 lets it be narrower than its contents. */
.trendrow,.suggestrow,.modelrow{
  display:grid; grid-auto-flow:column; grid-auto-columns:minmax(258px,262px);
  gap:14px; min-width:0;
  overflow-x:auto; overflow-y:hidden; scroll-snap-type:x proximity;
  scroll-padding-left:2px; -webkit-overflow-scrolling:touch;
  padding-bottom:10px;                   /* room for the scrollbar, not the cards */
  scrollbar-width:thin; scrollbar-color:var(--line) transparent;
}
/* Two rows deep, filled COLUMN BY COLUMN — grid-auto-flow:column with two
   template rows puts rank 1 and 2 in the first column, 3 and 4 in the second.
   So the strongest groups are the ones already on screen, and scrolling right
   walks down the ranking rather than across a row of it. */
.suggestrow{ grid-template-rows:repeat(2,auto); align-items:start; }

/* One handset per column. The model card is a row built for a full-width list,
   so in a column it needs its meta line kept on one line and the chevron
   dropped — the whole card is the button, and an arrow pointing at the edge of
   a carousel is one arrow too many next to the carousel's own. */
.modelrow{ grid-auto-columns:minmax(252px,286px); }
.modelrow .mcard{ padding:11px 12px; gap:10px; }
.modelrow .mcard__m{
  font-size:11.5px; gap:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.modelrow .mcard__n{ font-size:14px; }
.modelrow .mcard__go{ display:none; }

.trendrow > *,.suggestrow > *,.modelrow > *{ scroll-snap-align:start; }
.trendrow::-webkit-scrollbar,
.suggestrow::-webkit-scrollbar,
.modelrow::-webkit-scrollbar{ height:8px; }
.trendrow::-webkit-scrollbar-track,
.suggestrow::-webkit-scrollbar-track,
.modelrow::-webkit-scrollbar-track{ background:transparent; }
.trendrow::-webkit-scrollbar-thumb,
.suggestrow::-webkit-scrollbar-thumb,
.modelrow::-webkit-scrollbar-thumb{
  background:var(--line); border-radius:99px; border:2px solid transparent; background-clip:content-box;
}
.trendrow:hover::-webkit-scrollbar-thumb,
.suggestrow:hover::-webkit-scrollbar-thumb,
.modelrow:hover::-webkit-scrollbar-thumb{ background:var(--ink-3); background-clip:content-box; }
@media (max-width:520px){
  .trendrow,.suggestrow{ grid-auto-columns:minmax(232px,246px); }
  .modelrow{ grid-auto-columns:minmax(216px,240px); }
}

/* ---- carousel arrows ----------------------------------------------------
   Outside the cards, not over them: an arrow floating on a plate hides the
   part code it is sitting on. They sit in the gutter the centre column
   already has, appear only where there is somewhere to go, and are hidden
   entirely on touch, where the gesture is the control. */
.rail{ position:relative; }
.rail__nav{
  position:absolute; top:calc(50% - 5px); transform:translateY(-50%); z-index:3;
  width:30px; height:30px; border-radius:99px; display:grid; place-items:center;
  background:var(--surface); border:1px solid var(--line); color:var(--ink-2);
  box-shadow:var(--sh-2);
  transition:opacity .16s, background .16s, color .16s, visibility .16s;
}
.rail__nav svg{ width:16px; height:16px; }
.rail__nav:hover{ background:var(--teal-050); color:var(--teal-700); border-color:var(--teal-100); }
.rail__nav--prev{ left:-13px; }
.rail__nav--next{ right:-13px; }
.rail__nav:disabled{ opacity:0; visibility:hidden; pointer-events:none; }
.rail.is-static .rail__nav{ opacity:0; visibility:hidden; pointer-events:none; }
@media (hover:none){ .rail__nav{ display:none; } }

.gridcards{ display:grid; gap:14px; grid-template-columns:1fr; }
@media (min-width:640px){ .gridcards{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (min-width:1060px){ .gridcards{ grid-template-columns:repeat(3,minmax(0,1fr)); } }

.plate{
  --c:var(--teal-600);
  position:relative; display:flex; flex-direction:column; text-align:left; width:100%;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:var(--sh-1); overflow:hidden;
  content-visibility:auto; contain-intrinsic-size:auto 250px; cursor:pointer;
  transition:transform .2s cubic-bezier(.2,.8,.3,1), box-shadow .2s, border-color .2s;
}
.plate:hover{ transform:translateY(-3px); box-shadow:var(--sh-2); border-color:color-mix(in srgb,var(--c) 40%,var(--line)); }
/* printed label strip */
.plate__strip{
  display:flex; align-items:center; gap:8px; padding:8px 12px;
  background:color-mix(in srgb,var(--c) 9%,var(--surface-2));
  border-bottom:1px dashed color-mix(in srgb,var(--c) 32%,var(--line));
  font-family:var(--f-mono); font-size:11.5px; font-weight:600; color:color-mix(in srgb,var(--c) 72%,var(--ink));
  min-width:0;
}
.plate__strip > span:not(.plate__catbadge){ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.plate__strip .sep{ opacity:.4; flex:none; }
.plate__catbadge{ flex:none; }
.plate__strip .cat{ margin-left:auto; }
.plate__catbadge{
  margin-left:auto; display:inline-flex; align-items:center; gap:5px; height:21px; padding:0 8px;
  border-radius:var(--r-pill); background:var(--c); color:#fff;
  font-family:var(--f-ui); font-size:10.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase;
}
.plate__body{ padding:14px; display:flex; flex-direction:column; gap:12px; flex:1; }
.plate__master{ display:flex; gap:12px; align-items:center; }
.plate__mname{ font-family:var(--f-display); font-size:18.5px; font-weight:700; letter-spacing:-.028em; line-height:1.18; }
@media (min-width:768px){ .plate__mname{ font-size:19.5px; } }
.plate__mmeta{ display:flex; align-items:center; gap:7px; margin-top:4px; font-size:12px; color:var(--ink-3); font-weight:600; }
.plate__mmeta i{ font-style:normal; width:3px; height:3px; border-radius:99px; background:currentColor; }
.masterflag{
  display:inline-flex; align-items:center; gap:5px; height:20px; padding:0 7px; border-radius:5px;
  background:var(--amber-050); border:1px solid var(--amber-100); color:var(--amber-700);
  font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; margin-bottom:5px;
}
.masterflag svg{ width:11px; height:11px; }

.fitline{
  display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:var(--r-sm);
  background:var(--surface-2); border:1px solid var(--line-soft);
}
.fitline__n{ font-family:var(--f-display); font-size:22px; font-weight:800; letter-spacing:-.04em; color:var(--c); line-height:1; font-variant-numeric:tabular-nums; }
.fitline__t{ font-size:12px; font-weight:700; color:var(--ink-2); line-height:1.25; }
.fitline__bar{ margin-left:auto; display:flex; gap:3px; align-items:flex-end; height:22px; }
.fitline__bar span{ width:4px; border-radius:2px; background:color-mix(in srgb,var(--c) 45%,var(--line)); }

.devchips{ display:flex; flex-wrap:wrap; gap:6px; }
.devchip{
  font-size:12px; font-weight:600; padding:4px 9px; border-radius:var(--r-pill);
  background:var(--surface-3); color:var(--ink-2); border:1px solid transparent;
  max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.devchip--more{ background:transparent; border-color:var(--line); color:var(--ink-3); font-weight:700; }
.devchip--hit{ background:var(--teal-050); border-color:var(--teal-100); color:var(--teal-700); font-weight:700; }
.plate__foot{
  margin-top:auto; display:flex; align-items:center; gap:10px; padding:11px 14px;
  border-top:1px solid var(--line-soft); background:var(--surface-2);
}
.plate__foot .mono{ font-size:11px; color:var(--ink-3); }
.plate__cta{ margin-left:auto; display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--c); }
.plate__cta svg{ width:15px; height:15px; transition:transform .18s; }
.plate:hover .plate__cta svg{ transform:translateX(3px); }

/* ---------------- match result ---------------- */
.match{
  position:relative; overflow:hidden; border-radius:var(--r-xl); border:1px solid var(--teal-100);
  background:linear-gradient(180deg,var(--teal-050),var(--surface) 42%); box-shadow:var(--sh-2);
}
.match__head{
  display:flex; align-items:center; gap:8px; padding:13px 14px; flex-wrap:wrap;
  border-bottom:1px solid var(--line-soft);
}
@media (min-width:600px){ .match__head{ gap:10px; padding:14px 16px; } }
.match__badge{
  display:inline-flex; align-items:center; gap:7px; height:29px; padding:0 12px; border-radius:var(--r-pill);
  background:var(--grad-brand); color:#fff; font-size:12px; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
  box-shadow:var(--glow-brand);
}
.match__badge svg{ width:14px; height:14px; }
.match__body{ padding:16px; display:grid; gap:16px; }
@media (min-width:900px){ .match__body{ grid-template-columns:1.1fr 1fr; padding:20px; gap:22px; } }

.idgrid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1px; background:var(--line-soft); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
@media (min-width:560px){ .idgrid{ grid-template-columns:repeat(4,minmax(0,1fr)); } }
.idcell{ background:var(--surface); padding:10px 12px; min-width:0; }
.idcell span{ display:block; font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); }
.idcell b{ display:block; font-family:var(--f-mono); font-size:13px; font-weight:600; margin-top:3px; letter-spacing:-.02em; overflow:hidden; text-overflow:ellipsis; }

.mastercard{
  position:relative; overflow:hidden; border-radius:var(--r-lg); padding:16px;
  background:var(--grad-bench); color:#fff; box-shadow:var(--sh-2);
}
.mastercard::after{ content:""; position:absolute; right:-70px; top:-70px; width:220px; height:220px; border-radius:99px; background:radial-gradient(circle,rgba(255,138,61,.28),transparent 65%); }
.mastercard__in{ position:relative; z-index:1; }
.mastercard h3{ color:#fff; font-size:clamp(20px,3.4vw,26px); letter-spacing:-.03em; margin-top:8px; }
.mastercard .t-lab{ color:rgba(214,255,244,.7); }
.mspecs{ display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
.mspec{ background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); border-radius:8px; padding:5px 9px; font-size:11.5px; font-weight:700; color:#DCFAF2; }

/* ---------------- compatible device list ---------------- */
.complist__head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
.devlist{ display:flex; flex-direction:column; gap:1px; background:var(--line-soft); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
.dev{
  display:flex; align-items:center; gap:10px; padding:9px 12px; background:var(--surface); text-align:left; width:100%;
  transition:background .14s;
}
.dev:hover{ background:var(--surface-2); }
.dev__i{ font-family:var(--f-mono); font-size:11px; color:var(--ink-3); width:26px; flex:none; }
.dev__n{ font-weight:600; font-size:14px; letter-spacing:-.012em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dev__b{ margin-left:auto; font-size:11.5px; font-weight:700; color:var(--ink-3); flex:none; }
.dev.is-master{ background:var(--amber-050); }
.dev.is-hit{ background:var(--teal-050); box-shadow:inset 3px 0 0 var(--teal-500); }
.dev.is-hit .dev__n{ font-weight:800; color:var(--teal-700); }

.expandbtn{
  width:100%; height:44px; border-radius:var(--r-sm); border:1px dashed var(--line);
  color:var(--ink-2); font-weight:700; font-size:13.5px; display:inline-flex; align-items:center;
  justify-content:center; gap:8px; background:var(--surface-2); transition:all .16s;
}
.expandbtn:hover{ border-color:var(--teal-500); color:var(--teal-700); background:var(--teal-050); }
.expandbtn svg{ width:16px; height:16px; transition:transform .2s; }
.expandbtn.is-open svg{ transform:rotate(180deg); }

/* ---------------- model cards / brands ---------------- */
.brandgrid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
@media (min-width:600px){ .brandgrid{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
@media (min-width:960px){ .brandgrid{ grid-template-columns:repeat(4,minmax(0,1fr)); } }
@media (min-width:1240px){ .brandgrid{ grid-template-columns:repeat(5,minmax(0,1fr)); } }
.brandcard{
  position:relative; overflow:hidden; text-align:left; padding:16px; border-radius:var(--r-lg);
  background:var(--surface); border:1px solid var(--line); box-shadow:var(--sh-1);
  transition:transform .2s cubic-bezier(.2,.8,.3,1), box-shadow .2s, border-color .2s;
}
.brandcard:hover{ transform:translateY(-3px); box-shadow:var(--sh-2); }
.brandcard::after{
  content:""; position:absolute; right:-40px; top:-40px; width:120px; height:120px; border-radius:99px;
  background:radial-gradient(circle,color-mix(in srgb,var(--b1) 26%,transparent),transparent 68%);
}
.brandcard__n{ font-family:var(--f-display); font-size:17px; font-weight:700; letter-spacing:-.025em; margin-top:11px; }
.brandcard__c{ font-size:12px; color:var(--ink-3); font-weight:600; font-variant-numeric:tabular-nums; }

.modelgrid{ display:grid; grid-template-columns:1fr; gap:10px; }
@media (min-width:640px){ .modelgrid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (min-width:1100px){ .modelgrid{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
.mcard{
  display:flex; align-items:center; gap:12px; text-align:left; width:100%; padding:12px 14px;
  border-radius:var(--r); background:var(--surface); border:1px solid var(--line); box-shadow:var(--sh-1);
  content-visibility:auto; contain-intrinsic-size:auto 74px;
  transition:transform .18s cubic-bezier(.2,.8,.3,1), box-shadow .18s, border-color .18s;
}
.mcard:hover{ transform:translateY(-2px); box-shadow:var(--sh-2); border-color:var(--teal-500); }
.mcard__n{ font-weight:700; font-size:15px; letter-spacing:-.018em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mcard__m{ font-size:12px; color:var(--ink-3); font-weight:600; display:flex; gap:7px; align-items:center; }
.mcard__m i{ font-style:normal; width:3px; height:3px; border-radius:99px; background:currentColor; }
.mcard__go{ margin-left:auto; color:var(--ink-3); flex:none; }
.mcard__go svg{ width:17px; height:17px; }

/* spec sheet */
.specs{ display:grid; grid-template-columns:1fr; gap:1px; background:var(--line-soft); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
@media (min-width:520px){ .specs{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
.spec{ background:var(--surface); padding:11px 13px; display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
.spec dt{ font-size:12.5px; color:var(--ink-3); font-weight:600; }
.spec dd{ margin:0; font-size:13.5px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums; }

/* ---------------- overlay: sheet + modal ---------------- */
.scrim{
  position:fixed; inset:0; z-index:90; background:rgba(6,20,18,.5);
  backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  animation:fade .2s ease;
}
@keyframes fade{ from{ opacity:0; } }
.sheet{
  position:fixed; z-index:100; left:0; right:0; bottom:0; max-height:92dvh;
  background:var(--surface); border-radius:var(--r-xl) var(--r-xl) 0 0;
  box-shadow:var(--sh-3); display:flex; flex-direction:column; overflow:hidden;
  animation:slideup .3s cubic-bezier(.2,.9,.25,1);
}
@keyframes slideup{ from{ transform:translateY(6%); opacity:.6; } }
@media (min-width:820px){
  .sheet{
    left:50%; right:auto; bottom:auto; top:50%; transform:translate(-50%,-50%);
    width:min(860px,calc(100vw - 64px)); max-height:min(88dvh,880px); border-radius:var(--r-xl);
    animation:zoomin .22s cubic-bezier(.2,.9,.25,1);
  }
  @keyframes zoomin{ from{ transform:translate(-50%,-48%) scale(.97); opacity:0; } }
}
.sheet__grab{ width:38px; height:4px; border-radius:99px; background:var(--line); margin:9px auto 0; flex:none; }
@media (min-width:820px){ .sheet__grab{ display:none; } }
.sheet__head{
  display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line-soft); flex:none;
}
.sheet__body{ overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:16px; overscroll-behavior:contain; }
@media (min-width:820px){ .sheet__body{ padding:20px; } }
.sheet__foot{ flex:none; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line-soft); background:var(--surface-2); display:flex; gap:10px; }

/* ---------------- states ---------------- */
.state{ text-align:center; padding:38px 20px; display:flex; flex-direction:column; align-items:center; gap:12px; }
.state__art{ width:78px; height:78px; border-radius:22px; display:grid; place-items:center; background:var(--surface-3); color:var(--ink-3); }
.state__art svg{ width:34px; height:34px; }
.state__art--brand{ background:var(--teal-050); color:var(--teal-600); }
.state h3{ font-size:18px; }
.state p{ color:var(--ink-2); font-size:14px; max-width:44ch; }

.skel{ background:linear-gradient(90deg,var(--surface-3) 25%,var(--surface-2) 37%,var(--surface-3) 63%); background-size:400% 100%; animation:sh 1.3s ease-in-out infinite; border-radius:8px; }
@keyframes sh{ 0%{ background-position:100% 50%; } 100%{ background-position:0 50%; } }
.skelplate{ border-radius:var(--r-lg); border:1px solid var(--line); background:var(--surface); padding:14px; display:flex; flex-direction:column; gap:11px; }

/* ---------------- paywall ---------------- */
.paywall{
  position:relative; overflow:hidden; border-radius:var(--r-xl); padding:22px 18px;
  background:linear-gradient(150deg,#2A1405 0%,#7A3B0C 55%,#B45309 100%); color:#FFF3E6;
  box-shadow:var(--sh-2); text-align:center;
}
.paywall::before{
  content:""; position:absolute; inset:0; opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);
  background-size:26px 26px;
  mask-image:radial-gradient(90% 70% at 50% 0%,#000,transparent 75%);
  -webkit-mask-image:radial-gradient(90% 70% at 50% 0%,#000,transparent 75%);
}
.paywall > *{ position:relative; z-index:1; }
.paywall h3{ color:#fff; font-size:clamp(19px,3.4vw,25px); margin-top:12px; }
.paywall p{ color:rgba(255,240,225,.82); font-size:14px; margin:8px auto 0; max-width:46ch; }
.paywall__lock{ width:52px; height:52px; border-radius:16px; margin:0 auto; display:grid; place-items:center; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.2); color:#FFD9A8; }
.paywall__lock svg{ width:24px; height:24px; }
.paywall__acts{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:16px; }

/* deliberate locked state — replaces the old blurred-data treatment.
   Nothing real is ever obscured; restricted fields are simply not rendered. */
.lockbox{
  display:flex; align-items:center; gap:12px; padding:13px 14px;
  border-radius:var(--r); border:1px dashed var(--amber-100);
  background:var(--amber-050);
}
.lockbox__ico{
  width:34px; height:34px; flex:none; border-radius:10px; display:grid; place-items:center;
  background:var(--amber-100); color:var(--amber-700);
}
.lockbox__ico svg{ width:18px; height:18px; }
.lockbox__body{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.lockbox__body b{ font-size:13.5px; font-weight:700; color:var(--ink); letter-spacing:-.01em; }
.lockbox__body span{ font-size:12px; color:var(--ink-2); }

/* ---------------- plans ---------------- */
.plans{ display:grid; gap:16px; grid-template-columns:1fr; }
@media (min-width:820px){ .plans{ grid-template-columns:repeat(2,minmax(0,1fr)); align-items:start; } }
.plan{
  position:relative; overflow:hidden; border-radius:var(--r-xl); border:1px solid var(--line);
  background:var(--surface); box-shadow:var(--sh-1); padding:20px;
}
.plan--hero{ border-color:transparent; background:var(--grad-bench); color:#EAFBF6; box-shadow:var(--sh-3); }
.plan--hero::after{ content:""; position:absolute; right:-90px; bottom:-90px; width:280px; height:280px; border-radius:99px; background:radial-gradient(circle,rgba(255,138,61,.3),transparent 66%); }
.plan__in{ position:relative; z-index:1; }
.plan__tag{
  position:absolute; top:16px; right:16px; z-index:2; height:26px; padding:0 11px; border-radius:var(--r-pill);
  background:var(--grad-amber); color:#2A1405; font-size:11px; font-weight:800; letter-spacing:.06em;
  text-transform:uppercase; display:inline-flex; align-items:center;
}
.plan__name{ font-family:var(--f-display); font-size:19px; font-weight:700; letter-spacing:-.025em; }
.plan--hero .plan__name{ color:#fff; }
.plan__price{ display:flex; align-items:baseline; gap:6px; margin-top:10px; }
.plan__price b{ font-family:var(--f-display); font-size:clamp(38px,8vw,52px); font-weight:800; letter-spacing:-.045em; line-height:1; }
.plan__price span{ font-size:14px; font-weight:700; color:var(--ink-3); }
.plan--hero .plan__price span{ color:rgba(214,255,244,.7); }
.plan__note{ font-size:13px; margin-top:8px; color:var(--ink-2); }
.plan--hero .plan__note{ color:rgba(214,255,244,.78); }
.plan__feats{ display:flex; flex-direction:column; gap:9px; margin:16px 0 18px; }
.plan__feats li{ display:flex; gap:9px; align-items:flex-start; font-size:14px; font-weight:600; }
.plan__feats svg{ width:17px; height:17px; flex:none; margin-top:2px; color:var(--teal-600); }
.plan--hero .plan__feats svg{ color:var(--amber-400); }

/* ---------------- auth: Google button, registration form, country picker -- */
.gbtn{
  display:flex; align-items:center; justify-content:center; gap:11px; width:100%;
  height:52px; padding:0 18px; border-radius:var(--r-sm);
  background:var(--surface); color:var(--ink); border:1px solid var(--line);
  font-size:15.5px; font-weight:700; letter-spacing:-.01em; box-shadow:var(--sh-1);
  transition:border-color .16s, box-shadow .16s, transform .16s, opacity .16s;
}
.gbtn:hover{ border-color:var(--ink-3); box-shadow:var(--sh-2); }
.gbtn:active{ transform:translateY(1px); }
.gbtn__g{ display:grid; place-items:center; width:20px; height:20px; flex:none; }
.gbtn.is-disabled,.gbtn[disabled]{
  opacity:.5; cursor:not-allowed; box-shadow:none;
  background:var(--surface-2); color:var(--ink-3); border-style:dashed;
}
.gbtn.is-disabled:hover{ border-color:var(--line); box-shadow:none; }
.gbtn.is-busy{ opacity:.7; pointer-events:none; }

.regform{ display:flex; flex-direction:column; gap:12px; margin-top:18px; }
.regform__sub{
  display:flex; align-items:baseline; justify-content:space-between; gap:10px;
  margin-top:6px; padding-top:14px; border-top:1px solid var(--line-soft);
}
.ffield{ display:flex; flex-direction:column; gap:5px; min-width:0; }
.ffield .t-lab{ display:block; }
.ffield__err{ font-size:11.5px; font-weight:700; color:var(--bad); }
.ffield.has-error .input{ border-color:var(--bad); background:var(--bad-bg); }
.ffield.has-error .input:focus{ box-shadow:0 0 0 3px rgba(220,75,82,.18); }
.ffield--pair{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
@media (max-width:379px){ .ffield--pair{ grid-template-columns:1fr; } }

.phonerow{ display:flex; gap:8px; align-items:stretch; }
.phonerow .input{ flex:1 1 auto; min-width:0; }
.ccpick{
  display:flex; align-items:center; gap:6px; flex:none; max-width:46%;
  height:42px; padding:0 9px; border-radius:var(--r-sm);
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
  font-size:13.5px; font-weight:600;
}
.ccpick:hover{ border-color:var(--ink-3); }
.ccpick__flag{ font-size:17px; line-height:1; }
