<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F1F3F2">
<title>Pro-Glide order</title>
<link rel="icon" href="/assets/pay/proglide.png">
<link rel="apple-touch-icon" href="/assets/pay/proglide.png">
<!--
  The page an Instagram order's Pay now opens. It is a static file, so it shows at
  once with the Pro-Glide logo, and then puts the bill (/i/<token>) in its place.
  Opening /i/<token> directly made the reader wait on the server with nothing but
  the site's own icon to look at.
-->
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#F1F3F2;color:#0B1412;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;padding:16px;text-align:center}
img{width:112px;height:112px;object-fit:contain}
.bar{width:140px;height:4px;border-radius:4px;background:#D9E0DE;overflow:hidden}
.bar i{display:block;width:40%;height:100%;background:#E8590C;border-radius:4px;animation:go 1s ease-in-out infinite}
@keyframes go{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
p{margin:0;color:#5B6B67}
button{height:44px;padding:0 20px;border:0;border-radius:10px;background:#1D4ED8;color:#fff;font:inherit;font-weight:700}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
</style>
</head>
<body>
<img src="/assets/pay/proglide.png" alt="Pro-Glide">
<div class="bar" id="bar"><i></i></div>
<p id="msg">Opening your bill…</p>
<script>
(function () {
  var m = /^\/o\/([A-Za-z0-9_-]{20,64})\/?$/.exec(location.pathname);
  var msg = document.getElementById('msg');
  function fail(text, retry) {
    document.getElementById('bar').style.display = 'none';
    msg.textContent = text;
    if (retry) {
      var b = document.createElement('button');
      b.textContent = 'Try again';
      b.onclick = function () { location.reload(); };
      document.body.appendChild(b);
    }
  }
  if (!m) { fail('This bill link is not valid. Ask us to send it again.'); return; }
  fetch('/i/' + m[1], { cache: 'no-store' }).then(function (r) {
    if (r.status === 404) { fail('This bill link is not valid. Ask us to send it again.'); return null; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function (html) {
    if (!html) return;
    document.open();
    document.write(html);
    document.close();
  }).catch(function () { fail('Could not open the bill. Check your connection.', true); });
})();
</script>
</body>
</html>
